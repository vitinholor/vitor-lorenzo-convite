<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel — Vitor Lorenzo</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="admin-body">
<main class="admin">
  <div id="loginBox" class="painel-card">
    <h1>🔐 Área dos pais</h1>
    <p>Acesso privado às confirmações.</p>
    <form id="login">
      <label>Usuário</label><input id="usuario" value="admin" required>
      <label>Senha</label><input id="senha" type="password" required>
      <button class="btn enviar">ENTRAR</button>
    </form>
    <p class="aviso">Troque a senha no arquivo <code>.env</code> antes de publicar.</p>
  </div>

  <div id="dashboard" class="escondido">
    <header class="dash-head">
      <div><h1>🎂 Vitor Lorenzo</h1><p>Controle de confirmações — 27/12/2026</p></div>
      <button class="btn sair" onclick="sair()">SAIR</button>
    </header>
    <div class="cards">
      <div><span>Respostas</span><strong id="total">0</strong></div>
      <div><span>Confirmados</span><strong id="conf">0</strong></div>
      <div><span>Não irão</span><strong id="nao">0</strong></div>
      <div><span>Pessoas na festa</span><strong id="pessoas">0</strong></div>
    </div>
    <div class="painel-card">
      <div class="table-top">
        <h2>Lista de respostas</h2>
        <input id="busca" placeholder="Pesquisar nome..." oninput="renderTabela()">
      </div>
      <div class="tabela-wrap">
        <table>
          <thead><tr><th>Nome</th><th>Acompanhantes</th><th>Resposta</th><th>Data</th><th></th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<script>
let dados = [];
async function carregar() {
  const r = await fetch("/api/admin/respostas");
  if (r.status === 401) return;
  const d = await r.json();
  dados = d.respostas;
  total.textContent = d.totalRespostas;
  conf.textContent = d.confirmados;
  nao.textContent = d.naoIrao;
  pessoas.textContent = d.pessoasConfirmadas;
  renderTabela();
}
function renderTabela() {
  const q = document.getElementById("busca").value.toLowerCase();
  tbody.innerHTML = dados.filter(x => x.nome.toLowerCase().includes(q)).map(x => `
    <tr>
      <td><strong>${esc(x.nome)}</strong></td>
      <td>${x.resposta === "sim" ? x.acompanhantes : "—"}</td>
      <td>${x.resposta === "sim" ? '<span class="tag verde">CONFIRMADO</span>' : '<span class="tag vermelho">NÃO IRÁ</span>'}</td>
      <td>${new Date(x.criado_em.replace(" ","T")).toLocaleString("pt-BR")}</td>
      <td><button class="excluir" onclick="excluir(${x.id})">Excluir</button></td>
    </tr>`).join("");
}
function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function excluir(id) {
  if (!confirm("Excluir esta resposta?")) return;
  await fetch("/api/admin/respostas/" + id, {method:"DELETE"});
  carregar();
}
async function sair() {
  await fetch("/api/admin/logout",{method:"POST"});
  location.reload();
}
document.getElementById("login").addEventListener("submit", async e => {
  e.preventDefault();
  const r = await fetch("/api/admin/login", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({usuario:usuario.value, senha:senha.value})
  });
  if (!r.ok) return alert("Usuário ou senha incorretos.");
  loginBox.classList.add("escondido");
  dashboard.classList.remove("escondido");
  carregar();
});
</script>
</body>
</html>
