<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitor Lorenzo — 1 ano</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="convite">
  <img class="arte" src="/convite.png" alt="Convite do aniversário de Vitor Lorenzo">
  <section class="confirmacao">
    <p class="pergunta">Você vai comemorar esse dia especial com a gente? ❤️⚽</p>
    <div class="botoes">
      <button class="btn sim" onclick="abrirFormulario('sim')">✅ SIM, VOU ESTAR PRESENTE</button>
      <button class="btn nao" onclick="abrirFormulario('nao')">❌ NÃO PODEREI COMPARECER</button>
    </div>
  </section>
</main>

<div class="modal escondido" id="modal">
  <div class="caixa">
    <button class="fechar" onclick="fecharModal()">×</button>
    <h2 id="tituloModal">Confirmar presença</h2>
    <p id="textoModal">Preencha seu nome para registrar sua resposta.</p>
    <form id="form">
      <input type="hidden" id="resposta">
      <label>Seu nome</label>
      <input id="nome" maxlength="120" required placeholder="Digite seu nome">
      <div id="acompWrap">
        <label>Quantidade de acompanhantes</label>
        <input id="acompanhantes" type="number" min="0" max="20" value="0">
        <small>Informe somente as pessoas que irão com você.</small>
      </div>
      <button class="btn enviar" type="submit">ENVIAR CONFIRMAÇÃO</button>
    </form>
    <div id="sucesso" class="sucesso escondido"></div>
  </div>
</div>

<script>
let respostaAtual = "sim";

function abrirFormulario(resposta) {
  respostaAtual = resposta;
  document.getElementById("resposta").value = resposta;
  document.getElementById("modal").classList.remove("escondido");
  document.getElementById("tituloModal").textContent =
    resposta === "sim" ? "Confirmar presença 🎉" : "Registrar ausência";
  document.getElementById("textoModal").textContent =
    resposta === "sim"
      ? "Que alegria! Informe seu nome e, se houver, a quantidade de acompanhantes."
      : "Sem problema. Informe seu nome para registrarmos sua resposta.";
  document.getElementById("acompWrap").style.display = resposta === "sim" ? "block" : "none";
  document.getElementById("nome").focus();
}
function fecharModal() {
  document.getElementById("modal").classList.add("escondido");
  document.getElementById("form").style.display = "block";
  document.getElementById("sucesso").classList.add("escondido");
  document.getElementById("form").reset();
}
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await fetch("/api/confirmar", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      nome: document.getElementById("nome").value,
      resposta: respostaAtual,
      acompanhantes: document.getElementById("acompanhantes").value
    })
  });
  const data = await r.json();
  if (!r.ok) return alert(data.erro || "Não foi possível registrar.");
  document.getElementById("form").style.display = "none";
  const s = document.getElementById("sucesso");
  s.classList.remove("escondido");
  s.innerHTML = respostaAtual === "sim"
    ? "🎉 <strong>Presença confirmada!</strong><br>Estamos esperando você para comemorar o 1º aniversário do Vitor Lorenzo. 💚⚽"
    : "💚 <strong>Resposta registrada.</strong><br>Obrigado por avisar!";
});
</script>
</body>
</html>
